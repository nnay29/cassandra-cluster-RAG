services:
  cassandra1:
    image: cassandra:5.0.6
    container_name: cassandra1
    hostname: cassandra1
    restart: unless-stopped
    ports:
      - "9042:9042"
      - "7199:7199"
      - "7000:7000" # for node-to-node gossip traffic
    environment:
      - CASSANDRA_CLUSTER_NAME=success_cluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=RACK1
      - CASSANDRA_SEEDS=cassandra1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      # Removed the 0.0.0.0 addresses - let Cassandra auto-detect
      - CASSANDRA_RPC_ADDRESS=0.0.0.0 # This one is actually okay for client connections
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra1_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  cassandra1_data: